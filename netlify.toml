[build]
  command = "pwd; echo '--- ROOT ---'; ls -la; echo '--- CHECK FILES ---'; ls -la package.json vite.config.*; echo '--- PUBLIC ---'; ls -la public; npm ci; npm run build; echo '--- DIST ---'; ls -la dist; echo '--- SITEMAP ---'; ls -la dist/sitemap.xml || true"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/stadning"
  to = "/flyttstad"
  status = 301

[[redirects]]
  from = "/api/templates/download"
  to = "/.netlify/functions/templates-download"
  status = 200
  force = true

[[redirects]]
  from = "/api/templates/list"
  to = "/.netlify/functions/templates-list"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact-request"
  to = "/.netlify/functions/contact-request"
  status = 200
  force = true

[[redirects]]
  from = "/api/handplockat-interest-list"
  to = "/.netlify/functions/handplockat-interest-list"
  status = 200
  force = true

# Ensure static assets aren't swallowed by SPA fallback
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# SPA fallback (must be LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200