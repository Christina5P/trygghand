[build]
  command = "npm ci && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/stadning"
  to = "/flyttstad"
  status = 301

[[redirects]]
  from = "/api/templates/download"
  to = "/.netlify/functions/templates-download"
  status = 200
  force = true

[[redirects]]
  from = "/api/templates/list"
  to = "/.netlify/functions/templates-list"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact-request"
  to = "/.netlify/functions/contact-request"
  status = 200
  force = true

[[redirects]]
  from = "/api/handplockat-interest-list"
  to = "/.netlify/functions/handplockat-interest-list"
  status = 200
  force = true

[[redirects]]
from = "/google-feed.xml"
to = "/.netlify/functions/google-feed"
status = 200
force = true

# Ensure static assets aren't swallowed by SPA fallback
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

  [[redirects]]
from = "/sitemap-handplockat.xml"
to = "/.netlify/functions/sitemap-handplockat"
status = 200

[[redirects]]
  from = "/handplockat-og.jpg"
  to = "/handplockat-og.jpg"
  status = 200

[[redirects]]
  from = "/og.jpg"
  to = "/og.jpg"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/handplockat*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/handplockat*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback (must be LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200