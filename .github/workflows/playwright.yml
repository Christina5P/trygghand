name: 🧪 Playwright System Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.ts'
      - '.github/workflows/playwright.yml'
  
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.ts'

  workflow_dispatch:

jobs:
  test:
    name: 🧪 Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      DATABASE_ENV: test
      NODE_ENV: test
      CI: true

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: ⚙️ Setup test environment
        run: |
          echo "🔐 Verifying test environment..."
          
          # Verifiera test-miljö variabler
          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ SUPABASE_URL inte satt!"
            exit 1
          fi
          
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ SUPABASE_ANON_KEY inte satt!"
            exit 1
          fi
          
          # Verifiera att det är TEST-miljö
          if [[ ! "$SUPABASE_URL" =~ "fujeyujbchgrtaxodvcz" ]]; then
            echo "❌ SÄKERHETSFEL: Försök att köra mot PRODUKTION!"
            exit 1
          fi
          
          echo "✅ Test-miljö verifierad"

      - name: 🏗️ Build application
        run: npm run build

      - name: 🧪 Run Playwright tests
        run: npx playwright test --reporter=html

      - name: 📤 Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: 📸 Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7

      - name: ✅ Success
        if: success()
        run: echo "✅ All Playwright tests passed!"

      - name: ❌ Failure notification
        if: failure()
        run: exit 1

  security-check:
    name: 🔒 Security Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Verify test environment
        run: |
          echo "🔍 Security checks..."
          
          if grep -r "trygghand\.com" tests/ 2>/dev/null; then
            echo "❌ Production URL found in tests!"
            exit 1
          fi
          
          echo "✅ Security checks passed"
